version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - schema/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/furkanmeclis/go-ubltr
  exclusions:
    generated: lax
    paths:
      - schema/
