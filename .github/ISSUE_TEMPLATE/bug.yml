name: Bug report
description: Report incorrect behaviour in the library, CLI, or docs.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not include real invoice XML, taxpayer identifiers (TCKN / VKN), credentials, customer names, or production attachments.** Use `testdata/` fixtures or fully synthetic documents.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real e-Fatura / e-Arşiv data, taxpayer identifiers, credentials, or customer data.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - github.com/furkanmeclis/go-ubltr (core)
        - github.com/furkanmeclis/go-ubltr/render
        - github.com/furkanmeclis/go-ubltr/render/chromium
        - github.com/furkanmeclis/go-ubltr/cmd/ubltr
        - documentation
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
      placeholder: go version go1.26.1 darwin/arm64
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Synthetic reproduction
      description: Minimal Go snippet or synthetic XML. Redact all personal and tax data.
      render: go
    validations:
      required: false
